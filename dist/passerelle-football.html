<style>
:root{
  /* Palette : vert gazon profond, neutres légèrement verdis. Layout : rail latéral fixe + espace de travail en cartes. */
  --bg:#f3f5f3; --surface:#ffffff; --surface-2:#eef1ee; --ink:#121716; --muted:#4e5955; --line:#d9e0dc;
  --accent:#0b6b4d; --accent-ink:#ffffff; --accent-soft:#e1efe8;
  --ok:#1d8a4b; --warn:#a86400; --bad:#c2362b; --info:#2f5bd3;
  --ok-ink:#11683a; --warn-ink:#7a4900; --bad-ink:#a3261d; --info-ink:#2445a8;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(10,30,20,.05),0 8px 24px rgba(10,30,20,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0f0e; --surface:#151a18; --surface-2:#1c2220; --ink:#eef3f0; --muted:#9aa7a1; --line:#2a322f;
  --accent:#3fbf8c; --accent-ink:#06140e; --accent-soft:#16302a;
  --ok:#4cc27e; --warn:#e0a13d; --bad:#ef6a5e; --info:#7a9cff; --shadow:none; color-scheme:dark;
  --ok-ink:#7fdca5; --warn-ink:#f2bd66; --bad-ink:#ff9a90; --info-ink:#a8bcff;
}}
:root[data-theme="dark"]{
  --bg:#0c0f0e; --surface:#151a18; --surface-2:#1c2220; --ink:#eef3f0; --muted:#9aa7a1; --line:#2a322f;
  --accent:#3fbf8c; --accent-ink:#06140e; --accent-soft:#16302a;
  --ok:#4cc27e; --warn:#e0a13d; --bad:#ef6a5e; --info:#7a9cff; --shadow:none; color-scheme:dark;
  --ok-ink:#7fdca5; --warn-ink:#f2bd66; --bad-ink:#ff9a90; --info-ink:#a8bcff;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.5rem,1.25rem + .9vw,1.75rem);line-height:1.15} h2{font-size:clamp(1.125rem,1.05rem + .3vw,1.25rem)} h3{font-size:1rem} h4{font-size:0.875rem}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
:focus:not(:focus-visible){outline:none}
h1[tabindex="-1"]:focus{outline:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:0.875rem} .tiny{font-size:0.7812rem}
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand b{font-family:var(--font-display);font-size:1.0625rem;letter-spacing:-.01em}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.seg{display:grid;grid-template-columns:repeat(2,1fr);background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 4px;border-radius:8px;font-size:0.8125rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .lbl{font-size:0.6875rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 10px 4px}
.nav a{display:flex;align-items:center;justify-content:space-between;text-decoration:none;color:var(--ink);padding:8px 10px;border-radius:9px;font-size:0.875rem}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:0.6875rem;display:inline-grid;place-items:center;font-weight:600}
.demo-note{margin-top:auto;font-size:0.75rem;color:var(--muted);padding:10px;border:1px dashed var(--line);border-radius:10px}
.main{padding:28px clamp(16px,3vw,40px) 80px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card>h3{margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.stack{display:flex;flex-direction:column;gap:16px}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--font-display);font-size:1.75rem;font-weight:650;font-variant-numeric:tabular-nums}
.kpi .l{font-size:0.8125rem;color:var(--muted)}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:650;font-size:0.875rem;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 16px;min-height:2.5rem;border-radius:10px;cursor:pointer;font-size:0.9375rem;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap;transition:background .15s,border-color .15s,filter .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 12px;min-height:2.125rem;font-size:0.875rem;border-radius:9px}
.btn.danger-fill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.icon{padding:5px 8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:0.7812rem;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok-ink)}
.pill.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn-ink)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad-ink)}
.pill.info{background:color-mix(in srgb,var(--info) 15%,transparent);color:var(--info-ink)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.info{background:var(--info)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,12.5rem),1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:0.875rem;font-weight:600;color:var(--ink)}
.field .unit{font-weight:400;opacity:.8}
.field small{font-size:0.8125rem;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=number],input[type=date],input[type=month],input[type=search],select,textarea{width:100%;padding:10px 12px;border:1px solid color-mix(in srgb,var(--line) 70%,var(--muted));border-radius:10px;background:var(--surface);min-height:2.75rem;font-size:1rem}
textarea{resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.check{display:flex;align-items:center;gap:8px;font-size:0.875rem;cursor:pointer;padding:4px 0}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbox{position:relative;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:0.8125rem;background:var(--surface)}
.chipbox:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chipbox input{position:absolute;opacity:0;pointer-events:none}
.chipbox:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec+.sec{margin-top:6px;padding-top:18px;border-top:1px solid var(--line)}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:0.875rem}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:0.8125rem;font-weight:600;color:var(--muted);background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{white-space:nowrap}
td input,td select{min-height:2.125rem;padding:6px 8px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.score{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:1.0625rem;font-variant-numeric:tabular-nums;flex:none}
.score.hi{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok-ink)}
.score.mid{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn-ink)}
.score.lo{background:var(--surface-2);color:var(--muted)}
.prog{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.prog:last-child{border-bottom:0}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.kanban{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:12px;padding:10px;min-height:7.5rem;display:flex;flex-direction:column;gap:8px}
.col h4{display:flex;justify-content:space-between;font-size:0.8125rem;color:var(--muted);padding:2px 4px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:0.8125rem;display:flex;flex-direction:column;gap:6px}
.kc .t{font-weight:600;font-size:0.875rem}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
.filters .field{min-width:150px;flex:1 1 150px;max-width:240px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.video-wrap{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9}
.video-wrap video{width:100%;height:100%;display:block;background:#000}
.overlay{position:absolute;inset:0;display:none;place-items:center;background:linear-gradient(135deg,rgba(6,40,28,.92),rgba(0,0,0,.85));color:#fff;text-align:center;padding:20px}
.overlay.on{display:grid}
.overlay h2{font-size:clamp(22px,4vw,40px);color:#fff}
.nofile{position:absolute;inset:0;display:grid;place-items:center;color:#cfd8d4;text-align:center;padding:20px;background:repeating-linear-gradient(90deg,#0d3d2c 0 60px,#0f4532 60px 120px)}
.tagbar{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.tagbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:0.8125rem;font-weight:600}
.tagbtn kbd{font:0.75rem ui-monospace,Menlo,monospace;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.tagbtn:hover{border-color:var(--accent)}
.clip{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.clip:last-child{border-bottom:0}
.ctype{font-size:0.75rem;font-weight:700;padding:3px 8px;border-radius:7px;color:#fff;white-space:nowrap}
.stars button{border:0;background:none;cursor:pointer;padding:0 1px;font-size:0.9375rem;color:var(--line)}
.stars button.on{color:#e0a000}
.modal{position:fixed;inset:0;background:rgba(8,14,12,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal[hidden]{display:none}
.sheet{background:var(--surface);border-radius:18px;width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.sheet.wide{width:min(1040px,100%)}
.sheet-h{position:sticky;top:0;background:var(--surface);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);z-index:2}
.sheet-b{padding:20px;display:flex;flex-direction:column;gap:16px}
.toast{display:flex;align-items:center;gap:14px;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:0.875rem;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.toast[hidden]{display:none}
.callout{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:0.875rem}
.callout.warn{background:color-mix(in srgb,var(--warn) 12%,transparent)}
.pp{background:#fff;color:#16201c;border-radius:14px;border:1px solid var(--line);padding:28px;font-size:0.875rem}
.pp h1{font-size:1.625rem;color:#0b2a1f} .pp h3{font-size:0.75rem;text-transform:uppercase;letter-spacing:.08em;color:#0b6b4d;margin:18px 0 6px}
.pp .meta{color:#4a5a54}
.pp table{font-size:0.8125rem} .pp th{background:#f1f5f3;color:#4a5a54} .pp td,.pp th{border-color:#e3e9e6}
.prog-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:0.8125rem;color:var(--muted)}
.pitch{width:100%;height:auto;border-radius:12px;display:block;cursor:crosshair}
.compare th{position:sticky;left:0}
.mobile-top{display:none}

.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.vcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.thumb{position:relative;aspect-ratio:16/9;background:#0d3d2c center/cover no-repeat;display:grid;place-items:center;cursor:pointer;border:0;width:100%;padding:0;color:#fff}
.thumb.ph{background-image:repeating-linear-gradient(90deg,#0d3d2c 0 40px,#0f4532 40px 80px)}
.thumb .play{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);color:#0b2a1f;display:grid;place-items:center;font-size:1rem;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;font-size:0.75rem;padding:1px 6px;border-radius:6px;font-variant-numeric:tabular-nums}
.thumb .feat{position:absolute;left:8px;top:8px}
.vbody{padding:10px;display:flex;flex-direction:column;gap:8px}
.vbody input,.vbody select{min-height:2.125rem;padding:6px 9px}
.vmedia video{width:100%;border-radius:10px;background:#000;display:block;aspect-ratio:16/9}
.vmedia .vmissing{display:none;color:var(--muted)} .vmedia.missing .vmissing{display:block} .vmedia.missing video{opacity:.35}
.plan{display:flex;flex-direction:column;gap:10px}
.plan .price{font-family:var(--font-display);font-size:1.875rem;font-weight:700;font-variant-numeric:tabular-nums}
.plan .price span{font-size:0.875rem;color:var(--muted);font-weight:500}
.plan.current{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.plan .btn{margin-top:auto;justify-content:center}
.feat{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:0.875rem}
.blur{filter:blur(5px);user-select:none}
.ev{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:18px;align-items:start}
.evdate{border-radius:12px;background:var(--accent-soft);color:var(--accent);text-align:center;padding:10px 6px;font-weight:700;font-size:0.8125rem;text-transform:uppercase}

.bizchart{width:100%;max-width:900px;height:auto;display:block}

.badges{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:700px){.ev{grid-template-columns:1fr}}

/* Coquille, barre du haut, barre d'onglets mobile, palette, accessibilité */
.app{grid-template-columns:260px minmax(0,1fr)}
.mainwrap{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px clamp(16px,3vw,40px);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
.tb-brand{display:none;align-items:center;gap:8px;font-family:var(--font-display)} .tb-brand .logo{width:28px;height:28px;border-radius:8px}

.search-btn span{flex:1}

.rolebox{display:flex;flex-direction:column;gap:6px} .rolebox .lbl{font-size:0.75rem;color:var(--muted);font-weight:600;padding:0 4px;text-transform:uppercase;letter-spacing:.06em}

function playerCompleteness(p) {

const PROG_REQ = ['name','type','org','country','region','city','gender','conference','website','rosterSize','intlShare','currency','costAnnual','avgAid','gpaMin','englishMin','majors','deadline','verifiedAt','sourceUrl'];

function matchScore(p, pr) {
  const o = ORGS[pr.org] || {t:2.5};
  const parts = [], block = [];
  const g = pr.gender, pg = p.gender;
  if (g && g !== 'Mixte' && pg && ((g === 'Masculin' && pg !== 'Homme') || (g === 'Féminin' && pg !== 'Femme'))) return {score:0, parts:[], block:['Programme ' + g.toLowerCase()], excluded:true};
  const lv = levelOf(p.level); const pt = lv ? lv[2] : 2.5; const diff = pt - o.t;
  const lvl = diff >= 0 ? Math.max(0, 35 - diff * 8) : Math.max(0, 35 + diff * 16);
  parts.push({pts:lvl, max:35, good:'Niveau cohérent avec la division', bad: diff < 0 ? 'Niveau probablement en dessous de la division' : 'Division probablement en dessous de ton niveau'});
  const need = n0((pr.needs || {})[p.position]), need2 = n0((pr.needs || {})[p.position2]);
  const pos = need > 0 ? 20 : need2 > 0 ? 12 : 4;
  parts.push({pts:pos, max:20, good: need > 0 ? `${need} départ${need > 1 ? 's' : ''} prévu${need > 1 ? 's' : ''} à ton poste` : `Besoin à ton poste secondaire`, bad:'Pas de besoin déclaré à ton poste'});
  if (o.uni) {
    const intl = Math.min(15, n0(pr.intlShare) / 50 * 15);
    parts.push({pts:intl, max:15, good:`${n0(pr.intlShare)} % d’internationaux dans l’effectif`, bad:`Peu d’internationaux (${n0(pr.intlShare)} %)`});
    const net = Math.max(0, n0(pr.costAnnual) - n0(pr.avgAid)) * rate(pr.currency);
    const bud = n0(p.project.budgetMax);
    const b = !bud ? 8 : net <= bud ? 15 : Math.max(0, 15 - (net - bud) / bud * 15);
    parts.push({pts:b, max:15, good:`Reste à charge estimé ${money(net)} / an, dans ton budget`, bad:`Reste à charge estimé ${money(net)} / an, au-dessus de ton budget`});
    const gpa = gpaFrom20(p.academic.average);
    const ac = gpa == null ? 5 : (!pr.gpaMin || gpa >= n0(pr.gpaMin)) ? 10 : 3;
    parts.push({pts:ac, max:10, good:'Niveau académique suffisant', bad: gpa == null ? 'Moyenne non renseignée' : `GPA estimé ${gpa.toFixed(1)} sous le minimum (${pr.gpaMin})`});
    const engOk = !pr.englishRequired || (p.academic.englishTest && p.academic.englishTest !== 'Aucun' && has(p.academic.englishScore));
    parts.push({pts:engOk ? 5 : 1, max:5, good:'Test d’anglais OK', bad:'Test d’anglais manquant'});

  const got = parts.reduce((s, x) => s + x.pts, 0), max = parts.reduce((s, x) => s + x.max, 0);
  const score = Math.round(got / max * (o.uni ? 100 : 90));
  return {score, parts, block, note: o.uni ? '' : 'Évalué sur le niveau et le poste'};
}

function clipsFor(m, pid) { return m.clips.filter(c => !pid || c.playerId === pid).filter(c => ui.clipFilter === 'all' ? c.status !== 'refusé' : (c.status === ui.clipFilter || (c.type === ui.clipFilter && c.status !== 'refusé'))).sort((a, b) => a.t - b.t); }

function reelClips(m) {

let lastRoute = null;
function render() {
  const route = currentRoute();
  if (route !== lastRoute && lastRoute !== null && route !== 'videos' && route !== 'coach-matchs') ui.matchId = null;
  const ae = document.activeElement, fidv = ae && ae.id, sel = (() => { try { return ae && typeof ae.selectionStart === 'number' ? [ae.selectionStart, ae.selectionEnd] : null; } catch (e) { return null; } })();
  const scroll = window.scrollY;
  $('#app').innerHTML = shell((VIEWS[route] || vAccueil)(), route);
  if (fidv) { const el = document.getElementById(fidv); if (el && el !== document.body) { el.focus({preventScroll:true}); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
  if (route === lastRoute) window.scrollTo(0, scroll); else window.scrollTo(0, 0);
  lastRoute = route;
  document.title = 'Passerelle Football';
  bindVideo(); hydrateMedia();
}
function rerenderSoon() { setTimeout(render, 0); }

/* ---------- Rafraîchissements ciblés ---------- */
function refreshLive() {
  document.querySelectorAll('[data-live]').forEach(el => {
    const k = el.dataset.live;
    if (k === 'pcomp') el.innerHTML = ring(playerCompleteness(state.player).pct);
    else if (k === 'ccomp') el.innerHTML = ring(coachCompleteness(state.coach));
    else if (k.startsWith('prcomp-')) { const pr = state.programs[+k.slice(7)]; if (pr) el.innerHTML = ring(programCompleteness(pr)); }
    else if (k === 'biz') el.innerHTML = bizOutHTML();
    else if (k === 'mq') { const m = curMatch(); if (m) { const q = qualityScore(m); el.textContent = q + ' / 100'; el.className = 'pill ' + (q >= 70 ? 'ok' : q >= 45 ? 'warn' : 'bad'); } }
    else if (k === 'gpa') { const g = gpaFrom20(state.player.academic.average); el.textContent = g != null ? g.toFixed(2) + ' / 4' : '—'; }
    else if (k.startsWith('off-')) {
      const [, kind, i] = k.split('-'); const o = state.offers[+i]; if (!o) return;
      const net = Math.max(0, n0(o.cost) - n0(o.athletic) - n0(o.academic) - n0(o.other)), eur = net * rate(o.currency);
      if (kind === 'net') el.textContent = money(net, o.currency); else if (kind === 'eur') el.innerHTML = `<b>${money(eur)}</b>`; else el.textContent = money(eur * 4);
    }
  });
}

}

document.addEventListener('click', e => {

    if (el.dataset.num) {
      const raw = el.value.trim().replace(/\s/g, '').replace(',', '.');
      if (raw !== '' && isNaN(Number(raw))) { el.setAttribute('aria-invalid', 'true'); let er = document.getElementById(el.id + '-err'); if (!er) { er = document.createElement('p'); er.id = el.id + '-err'; er.className = 'field-err'; el.insertAdjacentElement('afterend', er); } er.textContent = 'Nombre attendu, par exemple 4,05'; el.setAttribute('aria-describedby', er.id); return; }
      set(el.dataset.bind, raw === '' ? '' : Number(raw)); saveSoon(); refreshLive(); return;
    }
    set(el.dataset.bind, el.type === 'number' ? (el.value === '' ? '' : Number(el.value)) : el.value);
    saveSoon(); refreshLive();
  } else if (el.dataset.draft && el.tagName !== 'SELECT') { draft[el.dataset.draft] = el.value; }
  else if (el.dataset.ui && el.type !== 'checkbox' && el.tagName !== 'SELECT') {
    setUI(el.dataset.ui, el.value); clearTimeout(window._uiT); window._uiT = setTimeout(render, 250);
  }
});

document.addEventListener('change', e => {
  const el = e.target;

  if (el.dataset.actionChange) { const fn = CHANGE_ACT[el.dataset.actionChange]; if (fn) fn(el.dataset.arg, el); return; }

async function mediaURL(v) {
  if (!v) return null;
  if (v.localKey) {
    if (mediaCache[v.localKey]) return mediaCache[v.localKey];
    try { const b = await IDB.get(v.localKey); if (b) { const u = URL.createObjectURL(b); mediaCache[v.localKey] = u; return u; } } catch (e) {}
  }
  if (v.assetId && IN_FRAME) return '/_blob/' + v.assetId;
  return null;
}
function hydrateMedia() {

  });
}

function probeVideo(blob) {
  return new Promise(res => {
    const v = document.createElement('video'); const u = URL.createObjectURL(blob); let done = false;
    const fin = o => { if (done) return; done = true; URL.revokeObjectURL(u); res(o); };
    const out = {duration:0, width:0, height:0, thumb:''};
    v.muted = true; v.playsInline = true; v.preload = 'metadata'; v.src = u;
    v.onloadedmetadata = () => { out.duration = isFinite(v.duration) ? Math.round(v.duration) : 0; out.width = v.videoWidth; out.height = v.videoHeight; try { v.currentTime = Math.min(1.5, (out.duration || 3) / 3); } catch (e) { fin(out); } };
    v.onseeked = () => { try { const c = document.createElement('canvas'); const w = 480, h = Math.round(w * (v.videoHeight || 9) / (v.videoWidth || 16)); c.width = w; c.height = h; c.getContext('2d').drawImage(v, 0, 0, w, h); out.thumb = c.toDataURL('image/jpeg', .72); } catch (e) {} fin(out); };
    v.onerror = () => fin(out);
    setTimeout(() => fin(out), 8000);
  });
}

function filterProspects(f, pr) {
  let list = allPlayers().map(p => ({p, r:matchScore(p, pr)}));
  if (f.gender !== 'all') list = list.filter(x => x.p.gender === f.gender);
  if (f.pos !== 'all') list = list.filter(x => x.p.position === f.pos || x.p.position2 === f.pos);
  if (n0(f.level)) list = list.filter(x => (levelOf(x.p.level) || [0, 0, 0])[2] >= n0(f.level));
  if (n0(f.minH)) list = list.filter(x => n0(x.p.height) >= n0(f.minH));
  if (f.foot !== 'all') list = list.filter(x => x.p.foot === f.foot);
  if (f.eng) list = list.filter(x => x.p.academic.englishTest && x.p.academic.englishTest !== 'Aucun');
  if (f.video) list = list.filter(x => clipCount(x.p) > 0 || (x.p.videos || []).some(v => v.visible));
  if (f.budget) list = list.filter(x => n0(x.p.project.budgetMax) >= Math.max(0, n0(pr.costAnnual) - n0(pr.avgAid)) * rate(pr.currency));
  if (f.verified) list = list.filter(x => x.p.verified && x.p.verified.identity);
  if (f.q) { const q = f.q.toLowerCase(); list = list.filter(x => (x.p.firstName + ' ' + x.p.lastName + ' ' + x.p.club + ' ' + x.p.city + ' ' + x.p.country).toLowerCase().includes(q)); }
  return list.sort((a, b) => b.r.score - a.r.score);
}

/* ---------- Modèle économique ---------- */
function bizCalc(b) {
  const fees = n0(b.payFees) / 100;
  const L = [];
  const proRev = n0(b.players) * n0(b.proConv) / 100 * n0(b.proPrice) * 12;
  L.push({k:'Abonnements joueurs Pro', rev:proRev, cost:proRev * fees + proRev * n0(b.partnerShareOfPro) / 100 * n0(b.partnerShare) / 100, why:'Récurrent, volume ; dépend de la valeur de l’audience et de l’analyse'});
  const accRev = n0(b.accSales) * n0(b.accPrice);
  L.push({k:'Accompagnement (forfaits)', rev:accRev, cost:accRev * (n0(b.accCostPct) / 100 + fees), why:'Cash immédiat et marge humaine ; ne passe pas à l’échelle sans équipe'});
  const clubRev = n0(b.clubs) * n0(b.teamsPerClub) * n0(b.teamPrice);
  L.push({k:'Licences club', rev:clubRev, cost:clubRev * fees, why:'Acquisition par équipe entière : un match importé crée 20 à 30 comptes'});
  const recRev = n0(b.recruiters) * n0(b.recPrice) * n0(state.settings.rateUsd) * 12;
  L.push({k:'Recruteurs Pro', rev:recRev, cost:recRev * fees, why:'Côté demande ; prix public unique, à valider avec les règles NCAA'});
  const evRev = n0(b.events) * n0(b.eventPlayers) * n0(b.eventPrice);
  L.push({k:'Journées de détection', rev:evRev, cost:n0(b.events) * n0(b.eventCost) + evRev * fees, why:'Revenu, données certifiées et contenu ; logistique lourde'});
  const mkRev = n0(b.gmv) * n0(b.take) / 100;
  L.push({k:'Commission services', rev:mkRev, cost:0, why:'Résout le manque de vidéo et de tests sans les produire soi-même'});
  const gpu = n0(b.matches) * n0(b.gpuCost);
  const rev = L.reduce((s, x) => s + x.rev, 0), direct = L.reduce((s, x) => s + x.cost, 0) + gpu;
  return {L, rev, direct, gpu, gross:rev - direct, result:rev - direct - n0(b.fixed)};
}
function bizOutHTML() {
  const c = bizCalc(state.biz), max = Math.max(1, ...c.L.map(x => x.rev));
  const H = 34 * c.L.length + 20;
  const bars = `<svg viewBox="0 0 900 ${H}" class="bizchart" role="img" aria-label="Chiffre d’affaires annuel par ligne de revenus">${c.L.map((x, i) => { const w = Math.max(2, x.rev / max * 520); const y = 10 + i * 34; return `<text x="220" y="${y + 17}" text-anchor="end" class="bl">${esc(x.k)}</text><rect x="232" y="${y + 4}" width="${w.toFixed(1)}" height="18" rx="5" class="bb"/><text x="${(240 + w).toFixed(1)}" y="${y + 17}" class="bv">${esc(money(x.rev))}</text>`; }).join('')}</svg>`;
  return `<div class="grid g4"><div class="card kpi"><span class="v">${money(c.rev)}</span><span class="l">Chiffre d’affaires annuel</span></div><div class="card kpi"><span class="v">${money(c.rev / 12)}</span><span class="l">Moyenne mensuelle</span></div><div class="card kpi"><span class="v">${c.rev ? Math.round(c.gross / c.rev * 100) : 0} %</span><span class="l">Marge brute</span></div><div class="card kpi"><span class="v" style="color:${c.result >= 0 ? 'var(--ok)' : 'var(--bad)'}">${money(c.result)}</span><span class="l">Résultat après coûts fixes</span></div></div>
  <section class="card" style="margin-top:16px"><h3>Chiffre d’affaires par ligne</h3>${bars}</section>
  <section class="card" style="margin-top:16px"><div class="tablewrap"><table><thead><tr><th>Ligne</th><th>CA annuel</th><th>Coûts directs</th><th>Marge</th><th>Part du CA</th><th>Rôle dans le modèle</th></tr></thead><tbody>${c.L.map(x => `<tr><td><b>${esc(x.k)}</b></td><td class="num">${money(x.rev)}</td><td class="num">${money(x.cost)}</td><td class="num">${money(x.rev - x.cost)}</td><td class="num">${c.rev ? Math.round(x.rev / c.rev * 100) : 0} %</td><td class="small">${esc(x.why)}</td></tr>`).join('')}<tr><td>Calcul vidéo (GPU)</td><td></td><td class="num">${money(c.gpu)}</td><td></td><td></td><td class="small">Coût par match à mesurer sur de vrais fichiers</td></tr><tr><td><b>Total</b></td><td class="num"><b>${money(c.rev)}</b></td><td class="num"><b>${money(c.direct)}</b></td><td class="num"><b>${money(c.gross)}</b></td><td></td><td></td></tr></tbody></table></div></section>`;
}
function vBusiness() {
  const B = 'biz.', n = (k, l, u, step) => F(B + k, l, 'number', {unit:u, step:step || 'any'});

bizCalc = function (b) {
  const fees = n0(b.payFees) / 100, L = [], rUsd = n0(state.settings.rateUsd);
  const add = (k, rev, cost, why) => L.push({k, rev, cost, why});
  const proRev = n0(b.players) * n0(b.proConv) / 100 * n0(b.proPrice) * 12;
  add('Abonnements joueurs Pro', proRev, proRev * fees + proRev * n0(b.partnerShareOfPro) / 100 * n0(b.partnerShare) / 100, 'Récurrent, volume ; dépend de la valeur de l’audience et de l’analyse');
  const accRev = n0(b.accSales) * n0(b.accPrice);
  add('Accompagnement (forfaits)', accRev, accRev * (n0(b.accCostPct) / 100 + fees), 'Cash immédiat et marge humaine ; limité par le temps de l’équipe');
  const clubRev = n0(b.clubs) * n0(b.teamsPerClub) * n0(b.teamPrice);
  add('Licences club', clubRev, clubRev * fees, 'Acquisition par équipe entière');
  const recRev = n0(b.recruiters) * n0(b.recPrice) * rUsd * 12;
  add('Recruteurs Pro', recRev, recRev * fees, 'Côté demande ; prix public unique');
  const evRev = n0(b.events) * n0(b.eventPlayers) * n0(b.eventPrice);
  add('Journées de détection', evRev, n0(b.events) * n0(b.eventCost) + evRev * fees, 'Revenu, données certifiées, contenu');
  add('Part sur les stages', n0(b.campPlayers) * n0(b.campPrice) * n0(b.campShare) / 100, 0, 'Revenu sans logistique : l’académie partenaire organise');
  add('Commission services', n0(b.gmv) * n0(b.take) / 100, 0, 'Comble le manque de vidéo et de tests');
  add('Affiliation partenaires', n0(b.players) * n0(b.perkUsers) / 100 * n0(b.perkConv) / 100 * n0(b.perkCommission), 0, 'Petit montant, coût nul, utile au joueur');
  const wl = n0(b.wlOrgs) * n0(b.wlPrice) + n0(b.schools) * n0(b.schoolPrice);
  add('Marque blanche et établissements', wl, wl * fees, 'B2B récurrent ; peut concurrencer l’accompagnement');
  const ag = n0(b.agents) * n0(b.agentPrice) * 12;
  add('Abonnements agents', ag, ag * fees, 'Outil seulement, aucune commission');
  const sp = n0(b.sponsors) * n0(b.sponsorAmount);
  add('Mécénat et sponsoring', sp, sp * n0(b.sponsorCostPct) / 100, 'Finance l’accès solidaire et les détections');
  const ac = n0(b.academySales) * n0(b.academyPrice);
  add('Académie en ligne', ac, ac * fees, 'Marge élevée une fois le contenu produit');
  const gpu = n0(b.matches) * n0(b.gpuCost);
  const rev = L.reduce((s, x) => s + x.rev, 0), direct = L.reduce((s, x) => s + x.cost, 0) + gpu;
  return {L, rev, direct, gpu, gross:rev - direct, result:rev - direct - n0(b.fixed)};
};

  openModal('Rechercher ou aller à', `<div class="pal"><label for="palQ" class="sr">Rechercher une page, une action, un programme ou un joueur</label><input type="search" id="palQ" class="pal-input" role="combobox" aria-expanded="true" aria-controls="palList" aria-autocomplete="list" autocomplete="off" placeholder="Page, action, programme, joueur…"><ul id="palList" class="pal-list" role="listbox" aria-label="Résultats"></ul><p class="tiny muted" style="margin:0">↑ ↓ pour choisir · Entrée pour ouvrir · Échap pour fermer</p></div>`);
  updatePalette();
}
function updatePalette() {
  const q = norm(($('#palQ') || {}).value || '').trim(), words = q.split(/\s+/).filter(Boolean);
  palShown = (words.length ? palItems.filter(it => { const t = norm(it.l + ' ' + it.s); return words.every(w => t.includes(w)); }) : palItems.filter(it => it.k.startsWith('act:') || it.k.startsWith('route:') && routeInfo(it.k.slice(6)).role === state.role)).slice(0, 40);
  palSel = Math.min(palSel, Math.max(0, palShown.length - 1));
  const ul = $('#palList'); if (!ul) return;
  ul.innerHTML = palShown.map((it, i) => `<li id="pal-${i}" role="option" aria-selected="${i === palSel}" class="pal-item" data-action="palGo" data-arg="${i}">${icon(it.ic)}<span class="pal-t">${esc(it.l)}</span><span class="pal-s">${esc(it.s)}</span></li>`).join('') || '<li class="pal-empty" role="option" aria-disabled="true">Aucun résultat</li>';
  const inp = $('#palQ'); if (inp) inp.setAttribute('aria-activedescendant', palShown.length ? 'pal-' + palSel : '');
  const cur = document.getElementById('pal-' + palSel); if (cur) cur.scrollIntoView({block:'nearest'});
}
function runPalette(i) {
  const it = palShown[i]; if (!it) return;
  const m = $('#modal'); m.hidden = true; m.innerHTML = ''; document.body.classList.remove('modal-open'); modalReturn = null;
  const [type, val] = [it.k.slice(0, it.k.indexOf(':')), it.k.slice(it.k.indexOf(':') + 1)];
  if (type === 'route') { if (location.hash.slice(1) === val) render(); else location.hash = val; return; }
  if (type === 'prog') { render(); ACT.viewProgram(val); return; }
  if (type === 'player') { render(); ACT.openProspect(val); return; }
  if (val === 'import') { if (state.role === 'entraineur') { location.hash = 'coach-matchs'; setTimeout(() => ACT.addMatch('team'), 60); } else { location.hash = 'videos'; setTimeout(() => ACT.addMatch('player'), 60); } return; }
  if (val === 'addVideo') { state.role = 'joueur'; location.hash = 'profil'; render(); const f = document.querySelector('input[data-upload=video]'); if (f) f.click(); return; }
  if (val === 'message') { render(); ACT.compose(''); return; }
  if (val === 'next') { state.role = 'joueur'; focusNextMissing(); return; }
  if (val === 'notifs') { render(); ACT.notifs(); return; }
  if (val === 'theme') { const order = ['auto','light','dark']; state.theme = order[(order.indexOf(state.theme || 'auto') + 1) % 3]; applyPrefs(); save(); render(); toast('Thème : ' + {auto:'automatique', light:'clair', dark:'sombre'}[state.theme] + '.'); return; }
  if (val === 'size') { state.textSize = state.textSize === 'lg' ? 'md' : 'lg'; applyPrefs(); save(); render(); toast(state.textSize === 'lg' ? 'Texte agrandi.' : 'Texte normal.'); }
}
document.addEventListener('input', e => { if (e.target.id === 'palQ') { palSel = 0; updatePalette(); } });
document.addEventListener('keydown', e => {
  const k = e.key, t = e.target, typing = /input|textarea|select/i.test(t.tagName || '') || t.isContentEditable;
  if ((e.metaKey || e.ctrlKey) && k.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
  if (k === '/' && !typing && $('#modal').hidden) { e.preventDefault(); openPalette(); return; }
  if (t.id === 'palQ') {
    if (k === 'ArrowDown') { e.preventDefault(); palSel = Math.min(palShown.length - 1, palSel + 1); updatePalette(); }
    else if (k === 'ArrowUp') { e.preventDefault(); palSel = Math.max(0, palSel - 1); updatePalette(); }
    else if (k === 'Enter') { e.preventDefault(); runPalette(palSel); }
  }
}, true);

function engineClips() { return state.matches.flatMap(m => m.clips.map(c => Object.assign({matchId:m.id}, c))).filter(c => c.origin === 'moteur' || c.origin === 'ia'); }
function engineStats() {
  const all = engineClips(), dec = all.filter(c => c.status === 'validé' || c.status === 'refusé');
  const ok = dec.filter(c => c.status === 'validé').length, ko = dec.length - ok;
  const reasons = {}; dec.filter(c => c.status === 'refusé').forEach(c => { reasons[c.reason || 'sans motif'] = (reasons[c.reason || 'sans motif'] || 0) + 1; });
  const consented = new Set([state.player.trainConsent ? 'me' : null, ...state.others.filter(o => o.trainConsent).map(o => o.id)].filter(Boolean));
  const labelled = dec.filter(c => consented.has(c.playerId)).length;
  return {proposed:all.length, decided:dec.length, ok, ko, precision:dec.length ? ok / dec.length : null, reasons, labelled, pending:all.length - dec.length};
}
// Rappel : sur un match qui a des marques manuelles ET des propositions, part des marques manuelles retrouvées à ±3 s.
function recallRows() {
  return state.matches.map(m => {
    const man = m.clips.filter(c => c.origin === 'manuel'), eng = m.clips.filter(c => c.origin === 'moteur' || c.origin === 'ia');
    if (!man.length || !eng.length) return null;
    const hit = man.filter(a => eng.some(b => Math.abs((b.t + b.dur * .43) - (a.t + a.dur * .6)) <= 3)).length;
    return {m, man:man.length, eng:eng.length, hit, recall:hit / man.length};
  }).filter(Boolean);
}

const aiRunV4 = aiRun;
aiRun = function () {
  const m = curMatch(); if (!m) return;
  m.target = {pick:ui.pick, number:($('#ai_num') || {}).value || '', color:($('#ai_col') || {}).value || ''};
  const before = new Set(m.clips.map(c => c.id));
  aiRunV4();
  // aiRunV4 crée les clips à la fin de sa minuterie : on enrichit ensuite les nouveaux.
  const t0 = Date.now(), iv = setInterval(() => {
    const fresh = m.clips.filter(c => !before.has(c.id));
    if (fresh.length || Date.now() - t0 > 8000) {
      clearInterval(iv);
      const r = rng(hashStr(m.id + fresh.length));
      fresh.forEach(c => { c.conf = Math.round((.35 + r() * .6) * 100) / 100; c.why = `Démo : ballon à ${(0.2 + r() * .5).toFixed(1).replace('.', ',')} hauteur de joueur de tes pieds pendant ${(0.3 + r() * .8).toFixed(1).replace('.', ',')} s`; c.engine = 'démo'; });
      if (fresh.length) { (m.engineRuns = m.engineRuns || []).unshift({date:new Date().toISOString().slice(0, 10), engine:'démo (simulation)', n:fresh.length}); save(); if (currentRoute() === 'videos' || currentRoute() === 'coach-matchs') render(); }
    }
  }, 200);
};

/* ---------- Import du résultat du moteur ---------- */
function importEngineJSON(m, txt) {
  let d; try { d = JSON.parse(txt); } catch (e) { toast('Ce fichier n’est pas un JSON lisible.'); return; }
  if (!d || d.format !== ENGINE_FORMAT || !Array.isArray(d.events)) { toast(`Format attendu : ${ENGINE_FORMAT}. Ce fichier ne vient pas du moteur Passerelle.`); return; }
  const pid = state.role === 'entraineur' ? (ui.tagPlayer || (roster()[0] || {}).id) : 'me';
  if (!m.duration && d.video && d.video.duration) m.duration = Math.round(d.video.duration);
  if (d.video && d.video.width && !m.width) { m.width = d.video.width; m.height = d.video.height; }
  const TYPES = new Set(CLIP_TYPES.map(c => c[0]));
  let added = 0, dup = 0;
  d.events.slice(0, 400).forEach(e => {
    const start = Math.max(0, +e.start || (+e.t - 3) || 0), end = +e.end || start + 7;
    if (!isFinite(start) || !isFinite(end)) return;
    if (m.clips.some(c => c.playerId === pid && Math.abs(c.t - start) < 2)) { dup++; return; }
    m.clips.push({id:uid(), type:TYPES.has(e.type) ? e.type : 'touche', t:Math.round(start * 10) / 10, dur:Math.min(15, Math.max(4, Math.round((end - start) * 10) / 10)), rating:0, inReel:false, origin:'moteur', status:'proposé', playerId:pid, conf:e.conf != null ? Math.round(+e.conf * 100) / 100 : null, why:String(e.why || '').slice(0, 140), engine:String(d.engine || 'moteur').slice(0, 40)});
    added++;
  });
  (m.engineRuns = m.engineRuns || []).unshift({date:new Date().toISOString().slice(0, 10), engine:String(d.engine || 'moteur').slice(0, 40), n:added, visible:d.stats && d.stats.target_visible_ratio});
  if (d.target) m.target = Object.assign({}, m.target, {number:d.target.jersey || (m.target || {}).number || '', color:d.target.color || (m.target || {}).color || '', click:Array.isArray(d.target.click) ? d.target.click.slice(0, 2) : null});
  { const u = usage(); if (state.role === 'entraineur') u.teamAnalyses++; else u.analyses++; }
  save(); ui.clipFilter = 'proposé'; render();
  toast(`${added} proposition${added > 1 ? 's' : ''} importée${added > 1 ? 's' : ''}${dup ? `, ${dup} déjà présente${dup > 1 ? 's' : ''}` : ''}. Valide ou refuse chacune.`);
}
document.addEventListener('change', e => {
  const el = e.target; if (!el || !el.matches || !el.matches('input[data-engine-import]')) return;
  const m = state.matches.find(x => x.id === el.dataset.engineImport), f = el.files && el.files[0]; if (!m || !f) return;
  if (f.size > 2e6) { toast('Fichier trop lourd pour un résultat d’analyse (2 Mo maximum).'); return; }
  f.text().then(t => importEngineJSON(m, t)); el.value = '';
});

/* ---------- Graphiques SVG ---------- */
const SERIES_COLORS = ['var(--accent)', '#d0702a', '#6a4fc4'];
function radarSVG(series, lang, size) {
  size = size || 300; const c = size / 2, R = size / 2 - 40, n = RADAR_AXES.length, pad = 64;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [c + Math.cos(a) * R * v / 100, c + Math.sin(a) * R * v / 100]; };
  const lab = i => RADAR_AXES[i][lang === 'en' ? 1 : lang === 'es' ? 2 : 0];
  const rings = [25, 50, 75, 100].map(v => `<polygon points="${RADAR_AXES.map((_, i) => pt(i, v).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join('');
  const spokes = RADAR_AXES.map((_, i) => { const [x, y] = pt(i, 100); return `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="var(--line)"/>`; }).join('');
  const labels = RADAR_AXES.map((_, i) => { const [x, y] = pt(i, 122); return `<text x="${x}" y="${y}" text-anchor="${Math.abs(x - c) < 4 ? 'middle' : x > c ? 'start' : 'end'}" dominant-baseline="middle" font-size="12" fill="var(--muted)">${esc(lab(i))}</text>`; }).join('');
  const polys = series.map((s, si) => { const vals = s.values.map(v => v == null ? 0 : v); const col = s.color || SERIES_COLORS[si]; return `<polygon points="${vals.map((v, i) => pt(i, v).join(',')).join(' ')}" fill="${col}" fill-opacity="${series.length > 1 ? .12 : .2}" stroke="${col}" stroke-width="2"/>${vals.map((v, i) => { const [x, y] = pt(i, v); return `<circle cx="${x}" cy="${y}" r="3" fill="${col}"/>`; }).join('')}`; }).join('');
  const desc = series.map(s => `${s.label} : ${RADAR_AXES.map((a, i) => `${lab(i)} ${s.values[i] == null ? 'non mesuré' : s.values[i] + 'e centile'}`).join(', ')}`).join(' ; ');
  return `<svg class="radar" viewBox="${-pad} 0 ${size + pad * 2} ${size}" role="img" aria-label="${esc('Profil en centiles. ' + desc)}">${rings}${spokes}${polys}${labels}</svg>`;
}
function heatSVG(hm, lang, attackRight) {

  const cells = hm.map((row, r) => row.map((v, c) => v > 3 ? `<rect x="${c * cw}" y="${H - (r + 1) * ch}" width="${cw + .5}" height="${ch + .5}" fill="#ffc21a" fill-opacity="${(.12 + v / 100 * .68).toFixed(2)}"/>` : '').join('')).join('');
  const lines = `<rect x="1" y="1" width="${W - 2}" height="${H - 2}" fill="none" stroke="#ffffffaa" stroke-width="2"/><line x1="${W / 2}" y1="1" x2="${W / 2}" y2="${H - 1}" stroke="#ffffffaa" stroke-width="2"/><circle cx="${W / 2}" cy="${H / 2}" r="31" fill="none" stroke="#ffffffaa" stroke-width="2"/><rect x="1" y="${H / 2 - 69}" width="56" height="138" fill="none" stroke="#ffffffaa" stroke-width="2"/><rect x="${W - 57}" y="${H / 2 - 69}" width="56" height="138" fill="none" stroke="#ffffffaa" stroke-width="2"/>`;
  const zone = (() => { let best = [0, 0, 0]; hm.forEach((row, r) => row.forEach((v, c) => { if (v > best[0]) best = [v, r, c]; })); const third = best[2] < 4 ? (lang === 'en' ? 'defensive third' : 'tiers défensif') : best[2] < 8 ? (lang === 'en' ? 'middle third' : 'tiers médian') : (lang === 'en' ? 'attacking third' : 'tiers offensif'); return third; })();

function pitchAuto(p) {
  const mo = metricsOf(p), out = [];
  const pos = POS_EN[p.position] || p.position;
  if (mo.v.distance90 != null) out.push(`${pos} covering ${(mo.v.distance90 / 1000).toFixed(1)} km per 90 (measured on video)`);
  else out.push(`${pos}${p.foot ? ', ' + ({Droit:'right', Gauche:'left', 'Les deux':'two'}[p.foot] || '') + '-footed' : ''}${p.height ? ', ' + p.height + ' cm' : ''}`);
  if (mo.v.passAcc != null) out.push(`${Math.round(mo.v.passAcc)}% pass accuracy, ${mo.pct.passAcc}th percentile among ${GROUP_EN[mo.g]}`);
  else if (mo.v.ga90 != null) out.push(`${(n0(p.stats.goals) + n0(p.stats.assists))} goals + assists in ${p.stats.matches || '?'} matches this season`);
  const lv = levelOf(p.level);
  out.push(`${lv ? (lv[3] || lv[1]) : 'Senior football'} starter at ${ageAt(p.birthDate) ?? '?'}${p.academic.englishScore ? ` · ${p.academic.englishTest} ${p.academic.englishScore}` : ''}`);
  return out.slice(0, 3);
}
async function downscaleImage(file, max, square) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    let sx = 0, sy = 0, sw = img.naturalWidth, sh = img.naturalHeight;
    if (square) { const s = Math.min(sw, sh); sx = (sw - s) / 2; sy = (sh - s) / 3; sw = sh = s; }
    const k = Math.min(1, max / Math.max(sw, sh)), c = document.createElement('canvas'); c.width = Math.round(sw * k); c.height = Math.round(sh * k);
    c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', .78);
  } finally { URL.revokeObjectURL(url); }
}

    return `<svg class="qr" viewBox="0 0 ${S} ${S}" shape-rendering="crispEdges" role="img" aria-label="${esc(opt.label || 'QR code')}"${opt.size ? ` width="${opt.size}" height="${opt.size}"` : ''}><rect width="${S}" height="${S}" fill="#fff"/><path d="${d}" fill="${opt.color || '#000'}"/></svg>`;
  }
  function draw(g, text, x, y, size) { const G = encode(text), N = G.length, q = 3, s = size / (N + q * 2); g.fillStyle = '#fff'; g.fillRect(x, y, size, size); g.fillStyle = '#000'; G.forEach((row, r) => row.forEach((v, c) => { if (v) g.fillRect(Math.floor(x + (c + q) * s), Math.floor(y + (r + q) * s), Math.ceil(s), Math.ceil(s)); })); }
  return {encode, svg, draw};
})();
function profileURL(p) { return `https://passerelle.app/p/${(hashStr(p.id + p.lastName) % 1e8).toString(36)}`; }

/* Carte QR sur la page Profil public, QR dans l'export et le carton de fin du studio */
const vPartageV6 = VIEWS.partage;
VIEWS.partage = function () {
  const p = state.player; let html = vPartageV6();
  const qrCard = `<section class="card"><h3>QR code du profil</h3><div class="qr-wrap">${QR.svg(profileURL(p), {label:'QR code menant au profil public'})}<div class="small"><p style="margin:0 0 8px">À imprimer sur ta fiche de détection, ton CV ou à montrer depuis ton téléphone : un recruteur ouvre ton profil en une seconde.</p><p class="tiny muted" style="margin:0 0 8px;overflow-wrap:anywhere">${esc(profileURL(p))}</p><button class="btn sm" data-action="qrDownload">Télécharger (SVG)</button></div></div></section>`;
  const coh = `<section class="card"><h3>Contrôles de cohérence</h3><p class="small muted" style="margin:0 0 8px">Ce qu’un recruteur attentif remarquerait. Une incohérence réduit l’indice de preuve.</p>${coherenceHTML(p)}</section>`;
  html = html.replace('<section class="card"><h3>Apparence du profil</h3>', qrCard + '<section class="card"><h3>Apparence du profil</h3>');
  html = html.replace('<section class="card"><h3>Indice de preuve', coh + '<section class="card"><h3>Indice de preuve');
  return html;
};
ACT.qrDownload = () => { const p = state.player; saveFile(`qr-profil-${(p.lastName || 'joueur').toLowerCase()}.svg`, '<?xml version="1.0" encoding="UTF-8"?>' + QR.svg(profileURL(p)).replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" ')); };
const profileDocV6 = profileDoc;
profileDoc = function (p, opt) {
  let html = profileDocV6(p, opt);
  if (opt && opt.export) html = html.replace('<footer class="pp2-foot">', `<footer class="pp2-foot"><div class="pp2-qr">${QR.svg(profileURL(p), {label:'QR code du profil', size:96})}<span>${esc(profileURL(p))}</span></div>`);
  return html;
};
const studioPaintCardV6 = studioPaintCard;
studioPaintCard = function (cv, kind, k) {
  studioPaintCardV6(cv, kind, k);
  if (kind !== 'outro' || !cv) return;
  const g = cv.getContext('2d'), W = cv.width, H = cv.height, sz = Math.round(Math.min(W, H) * .3);
  g.globalAlpha = Math.min(1, k * 3); QR.draw(g, profileURL(state.player), Math.round(W / 2 - sz / 2), Math.round(H / 2 + Math.min(W, H) * .16), sz); g.globalAlpha = 1;
};

/* ---------- Rapport de match ---------- */
function matchReportHTML(m, pid, exp) {
  const p = findPlayer(pid) || state.player, e = (m.engine || {})[pid], sh = (m.sheet || {})[pid], q = e && e.quality;
  const vc = m.clips.filter(c => c.playerId === pid && c.status === 'validé').sort((a, b) => (a.at || a.t) - (b.at || b.t));
  const passes = vc.filter(c => c.type === 'passe'), known = passes.filter(c => c.outcome === 'reussie' || c.outcome === 'perdue'), ok = known.filter(c => c.outcome === 'reussie').length;
  const S = e && e.summary || {}, ph = e && e.physical;
  const tile = (v, l, pf) => `<div class="pp2-key"><b>${v}</b><span>${esc(l)}</span>${pf ? `<em>${proofPill(pf)}</em>` : ''}</div>`;
  const tiles = [
    sh && has(sh.minutes) ? tile(esc(sh.minutes) + '<small> min</small>', 'Temps de jeu', sh.validated ? 'coach' : 'declare') : '',
    ph ? tile((ph.distance_m / 1000).toFixed(1).replace('.', ',') + '<small> km</small>', `Distance (${Math.round(ph.minutes_tracked)} min suivies)`, 'moteur') : '',
    ph ? tile(ph.sprints, `Sprints · pointe ${String(ph.top_speed_kmh).replace('.', ',')} km/h`, 'moteur') : '',
    known.length ? tile(`${ok}/${known.length}`, 'Passes réussies (validées)', 'moteur') : S.passes_known ? tile(`${S.passes_ok}/${S.passes_known}`, 'Passes réussies (moteur)', 'moteur') : '',
    S.progressive_passes != null ? tile(S.progressive_passes, 'Passes progressives', 'moteur') : '',
    S.recoveries != null ? tile(S.recoveries, 'Récupérations', 'moteur') : '',
    sh && (has(sh.goals) || has(sh.assists)) ? tile(`${n0(sh.goals)} · ${n0(sh.assists)}`, 'Buts · passes décisives', sh.validated ? 'coach' : 'declare') : ''
  ].filter(Boolean).join('');
  const acts = vc.length ? `<table><thead><tr><th>Minute</th><th>Action</th><th>Détail</th></tr></thead><tbody>${vc.map(c => `<tr><td>${Math.floor((c.at || c.t) / 60)}’</td><td>${esc(ctype(c.type)[1])}${c.outcome === 'reussie' ? ' ✓' : c.outcome === 'perdue' ? ' ✗' : ''}</td><td>${esc(c.why || (c.origin === 'manuel' ? 'Marqué à la main' : ''))}</td></tr>`).join('')}</tbody></table>` : '<p>Aucune action validée pour ce match.</p>';
  return `<article class="pp2" style="--pa:${profileAccent(p)}"><header class="pp2-hero cover-terrain"><div class="pp2-kick">Rapport de match · ${esc(fdate(m.date))}${m.competition ? ' · ' + esc(m.competition) : ''}</div><h1>${esc(m.title)}</h1><div class="pp2-meta">${esc(p.firstName)} ${esc(p.lastName)} · ${esc(p.position)}${q ? ` · qualité d’analyse ${esc(q.grade)}` : ''}</div></header>
    ${tiles ? `<div class="pp2-keys">${tiles}</div>` : ''}
    ${e && e.heatmap ? `<section class="pp2-sec"><div class="pp2-two"><div><h2>Zones occupées</h2>${heatSVG(e.heatmap.values, 'fr')}</div><div><h2>Qualité de l’analyse</h2><div class="pp2-facts"><div><span>Note</span><b>${esc(q ? q.grade : '—')}</b></div><div><span>Joueur visible</span><b>${q ? Math.round(q.target_visible_ratio * 100) + ' %' : '—'}</b></div><div><span>Ballon visible</span><b>${q && q.ball_visible_ratio != null ? Math.round(q.ball_visible_ratio * 100) + ' %' : '—'}</b></div><div><span>Caméra</span><b>${q ? (q.camera_fixed ? 'Fixe' : 'Mobile') : '—'}</b></div></div>${q && q.warnings && q.warnings.length ? `<p class="pp2-note">${q.warnings.map(esc).join(' ')}</p>` : ''}</div></div></section>` : ''}
    <section class="pp2-sec"><h2>Actions validées (${vc.length})</h2>${acts}</section>
    <footer class="pp2-foot">Chiffres du moteur Passerelle${e ? ' (' + esc(e.version) + ')' : ''}, actions validées par le joueur${sh && sh.validated ? ', feuille de match validée par l’entraîneur' : ''}.${exp ? ' Profil complet : ' + esc(profileURL(p)) : ''}</footer></article>`;
}
Object.assign(ACT, {
  report(id) {
    const m = state.matches.find(x => x.id === (id || (curMatch() || {}).id)); if (!m) return;
    const pid = state.role === 'entraineur' ? (ui.tagPlayer || (roster()[0] || {}).id) : 'me';
    ui.reportId = m.id;
    openModal('Rapport de match', `${matchReportHTML(m, pid)}<div class="actions"><button class="btn primary" data-action="reportExport">Exporter en HTML</button><button class="btn" data-action="reportPrint">Imprimer ou PDF</button></div>`, true);
  },
  reportExport() {
    const m = state.matches.find(x => x.id === ui.reportId); if (!m) return; const pid = state.role === 'entraineur' ? (ui.tagPlayer || (roster()[0] || {}).id) : 'me';
    const html = `<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rapport · ${esc(m.title)}</title><style>body{margin:0;background:#eef2f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}main{max-width:880px;margin:24px auto;padding:0 12px}.tiny{font-size:.75rem}.muted{color:#55625d}${PP2_CSS}</style></head><body><main>${matchReportHTML(m, pid, true)}</main></body></html>`;
    saveFile(`rapport-${(m.opponent || 'match').toLowerCase().replace(/[^a-z0-9]+/gi, '-')}-${m.date}.html`, html);
  },
  reportPrint() { const sheet = document.querySelector('#modal .sheet-b'); if (!sheet) return; document.body.classList.add('print-modal'); window.print(); setTimeout(() => document.body.classList.remove('print-modal'), 500); }
});

/* ---------- Entraîneur : valider les feuilles de match de l'effectif ---------- */
function pendingSheets() {
  const ids = new Set(roster().map(p => p.id)); const out = [];
  state.matches.forEach(m => Object.entries(m.sheet || {}).forEach(([pid, sh]) => { if (ids.has(pid) && !sh.validated) out.push({m, pid, sh, p:findPlayer(pid)}); }));
  return out;
}
const vCoachAccueilV6 = VIEWS['coach-accueil'];
VIEWS['coach-accueil'] = function () {
  const html = vCoachAccueilV6(), pend = pendingSheets();
  const card = `<section class="card" style="margin-top:16px"><h3>Feuilles de match à valider <span class="pill ${pend.length ? 'warn' : 'ok'}">${pend.length}</span></h3><p class="small muted" style="margin:0 0 8px">Ta validation fait passer le temps de jeu, les buts et les passes décisives au niveau « Validé par l’entraîneur » sur le profil du joueur.</p>
    ${pend.length ? `<div class="list">${pend.map(({m, pid, sh, p}) => `<div class="row"><div class="grow"><div class="t">${esc(p ? p.firstName + ' ' + p.lastName : pid)}</div><div class="small muted">${esc(m.title)} · ${fdate(m.date)} · ${esc(sh.minutes || '?')} min · ${n0(sh.goals)} but${n0(sh.goals) > 1 ? 's' : ''} · ${n0(sh.assists)} passe${n0(sh.assists) > 1 ? 's' : ''} déc.</div></div><button class="btn sm primary" data-action="sheetValidate" data-arg="${m.id}|${pid}">Valider</button></div>`).join('')}</div>` : '<div class="empty">Tout est validé.</div>'}</section>`;
  return html + card;
};
ACT.sheetValidate = function (a) {
  const [mid, pid] = String(a).split('|'); const m = state.matches.find(x => x.id === mid); const sh = m && m.sheet && m.sheet[pid]; if (!sh) return;
  sh.validated = true; sh.validatedBy = (state.coach.firstName + ' ' + state.coach.lastName).trim(); sh.validatedAt = today();
  if (pid === 'me') state.notifications.unshift({id:uid(), to:'joueur', text:`${sh.validatedBy} a validé ta feuille de match contre ${m.opponent || m.title}.`, date:today(), read:false});
  save(); render(); toast('Feuille de match validée.');
};

/* ---------- Démarrage ---------- */
load(); applyPrefs();
if (!location.hash) history.replaceState(null, '', '#' + HOME[state.role]);
render();
(async () => {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const [s, d, a, as] = await Promise.all([window.claude.use('sample').catch(() => null), window.claude.use('downloads').catch(() => null), window.claude.use('artifact').catch(() => null), window.claude.use('assets').catch(() => null)]);
    caps.sample = s; caps.downloads = d; caps.artifact = a; caps.assets = as;
    if (s || d || a || as) { if ($('#modal').hidden) render(); }
  } catch (e) {}
})();
</script>
</body>
